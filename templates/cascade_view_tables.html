<!DOCTYPE html>
<html>
<head>
    <title>Data Samples before and after Processing</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Sample Data from IoT Flow-based Dataset</h1>
    {% for table in tables %}
        <h2>{{ titles[loop.index0] }}</h2>
        {{ table | safe }}
    {% endfor %}

</body>
</html>
