<!DOCTYPE html>
<html>
<head>
    <title>Cascade Learning Demo</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
	<h1>  Cascade Learning Demo </h1>
    <div class="panel panel-default">
	    <div class="btn-group">
    		<button id="LoadOrig">Load Data</button>
	    </div>
	    <div class="btn-group">
    		<button id="LoadProc">Preprocess Data</button>
	    </div>


	    <div class="btn-group">
    		<select name="select_model"  id="modelSelect">
		<option value="" selected disabled>Load Model </option>
    		<option value="model_option1">Instance Distributor</option>
    		<option value="model_option2">Submodel 1</option>
    		<option value="model_option3">Submodel 2</option>
    		<option value="model_option4">Submodel 3</option>
    		<option value="model_option5">Submodel 4</option>
    		</select>
	    </div>

	    <div class="btn-group">
    		<select name="select_method"  id="methodSelect">
    		<option value="" selected disabled>Test Model </option>
    		<option value="test_method_option1">Generate Test Summary</option>
    		<option value="test_method_option2">Trace Decision Path</option>
    		</select>
	    </div>

	    <div class="btn-group">
    		<select name="attack_view"  id="attackView">
    		<option value="" selected disabled>Attack Model </option>
    		<option value="attack_option1"> Compute Feature Correlation </option>
    		<option value="attack_option2"> Generate Attack Result</option>
    		</select>
	    </div>

	    <div class="btn-group">
    		<select name="adtrain_view"  id="adtrainView">
    		<option value="" selected disabled> Adversarial Re-training </option>
    		<option value="adtrain_option1"> Generate Ad-Train Results  </option>
    		<option value="adtrain_option2"> Compare Decision Boundary </option>
    		</select>
	    </div>
    </div>

    <iframe id = "tableContainter" width="100%" height="800px"></iframe>
    <script>
	function choose_action(id, url, passParam=false) {
            const element = document.getElementById(id);
            element.addEventListener("click", async () => {
                const selectedValue = event.target.value;
                const tableContainer = document.getElementsByTagName('iframe')[0];
		if (passParam == true) {
	            tableContainer.src = url+'?selected='+selectedValue;
	        } else {
	            tableContainer.src = url;
	        }
            });
        }

	function reset_dropdowns() {
            document.addEventListener('click', function(event) {
  		// Get all select elements on the page
  		const dropdowns = document.querySelectorAll('select');

  		// Loop through each dropdown and reset its selected option
  		dropdowns.forEach(function(dropdown) {
    			// Find the default option (the one with the 'selected' attribute)
    			const defaultOption = dropdown.querySelector('option[selected]');

    			// If a default option is found, set the dropdown's value to it
    			if (defaultOption) {
      				dropdown.value = defaultOption.value;
    			} else {
      				// If no default option is explicitly set,
      				// you can set the selectedIndex to 0 to select the first option
      				dropdown.selectedIndex = 0; // This will select the first option
    			}
  		});
	    });
	}

	choose_action('LoadOrig', '/get_orig_data');
	choose_action('LoadProc', '/get_proc_data');
	choose_action('modelSelect', '/get_all', true);
	reset_dropdowns()
	choose_action('methodSelect', '/get_all', true);
	choose_action('attackView', '/get_all', true);
	choose_action('adtrainView', '/get_all', true);

    </script>

</body>
</html>
