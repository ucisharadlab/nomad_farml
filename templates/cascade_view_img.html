<!DOCTYPE html>
<html>
<head>
    <title>Accuracy and F1</title>
<style>
* {
  box-sizing: border-box;
}

.row {
  display: flex;
}

/* Create three equal columns that sits next to each other */
.column {
  flex: 33.33%;
  padding: 5px;
}
</style>

</head>
<body>
    <div class="row">
    {% for plot in plots %}
    <div class="column">
    	<img src = "{{ plot }}">
    </div>
    {% endfor %}
    </div>
</body>
</html>
